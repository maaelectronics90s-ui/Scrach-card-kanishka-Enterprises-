<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कनिष्क एंटरप्राइज - खास ऑफर</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            width: 320px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            text-align: center;
            position: relative;
        }
        h2 { color: #0d47a1; margin-bottom: 5px; font-size: 22px; }
        h3 { color: #1565c0; margin-top: 0; font-size: 15px; }
        .scratch-container {
            position: relative;
            width: 250px;
            height: 120px;
            margin: 15px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }
        .reward {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #e3f2fd;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #1b5e20;
        }
        .reward span { font-size: 28px; color: #b71c1c; }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        .footer-text { font-size: 12px; color: #444; margin-top: 12px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏢 कनिष्क एंटरप्राइज 🏢</h2>
    <h3>विशेष ग्राहक धमाका ऑफर!</h3>
    
    <div class="scratch-container">
        <div class="reward">
            <div>बधाई हो! आपने जीता</div>
            <span id="amount">₹000</span>
            <div>का विशेष डिस्काउंट!</div>
        </div>
        <canvas id="scratch" width="250" height="120"></canvas>
    </div>

    <p style="font-weight: bold; font-size: 14px; color: #333;">यहाँ उंगली से स्क्रैच करें!</p>
    <div class="footer-text">
        📍 बाराहाट, गोड्डा (झारखंड) - 814160<br>
        *नियम एवं शर्तें लागू।
    </div>
</div>

<script>
    const rewards = [100, 200, 300, 500, 1000, 1500, 2000];
    const selectedReward = rewards[Math.floor(Math.random() * rewards.length)];
    document.getElementById('amount').innerText = '₹' + selectedReward;

    const canvas = document.getElementById('scratch');
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#cfd8dc';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.font = 'bold 16px Arial';
    ctx.fillStyle = '#263238';
    ctx.textAlign = 'center';
    ctx.fillText('यहाँ स्क्रैच करें 🎁', canvas.width / 2, canvas.height / 2 + 5);

    let isDrawing = false;

    function scratch(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 15, 0, Math.PI * 2);
        ctx.fill();
    }

    canvas.addEventListener('mousedown', () => isDrawing = true);
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mousemove', scratch);

    canvas.addEventListener('touchstart', () => isDrawing = true);
    canvas.addEventListener('touchend', () => isDrawing = false);
    canvas.addEventListener('touchmove', scratch);
</script>

</body>
</html>
